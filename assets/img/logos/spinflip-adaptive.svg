<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .blueprint { display: none; }
      .paper     { display: none; }
      @media (prefers-color-scheme: dark)  { .blueprint { display: block; } }
      @media (prefers-color-scheme: light) { .paper     { display: block; } }
    </style>
    <pattern id="grid-bp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#9ec5e8" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <pattern id="grid-pp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#5b5b5b" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Blueprint: dark navy background, steel-blue secondary, amber accent -->
  <g class="blueprint">
    <rect width="400" height="400" fill="#0a2540"/>
    <rect width="400" height="400" fill="url(#grid-bp)"/>
    <line x1="200" y1="40"  x2="200" y2="80"  stroke="#9ec5e8" stroke-width="0.5" opacity="0.5"/>
    <line x1="200" y1="320" x2="200" y2="360" stroke="#9ec5e8" stroke-width="0.5" opacity="0.5"/>
    <line x1="40"  y1="200" x2="80"  y2="200" stroke="#9ec5e8" stroke-width="0.5" opacity="0.5"/>
    <line x1="320" y1="200" x2="360" y2="200" stroke="#9ec5e8" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="140" fill="none" stroke="#9ec5e8" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.5"/>
    <g transform="translate(200,200) scale(2.4)">
      <g transform="translate(-44,0)">
        <circle r="22" fill="none" stroke="#ffffff" stroke-width="1.6"/>
        <circle r="2.5" fill="#ffffff"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffb84d" stroke-width="2"/>
        <path d="M -4 -8 L 0 -12 L 4 -8" fill="none" stroke="#ffb84d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g>
        <path d="M -16 0 q 4 -6 8 0 t 8 0 t 8 0 t 8 0" fill="none" stroke="#ffb84d" stroke-width="1.4"/>
        <text x="0" y="-18" text-anchor="middle" fill="#ffb84d" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="0.1em">21 cm</text>
      </g>
      <g transform="translate(44,0)">
        <circle r="22" fill="none" stroke="#ffffff" stroke-width="1.6"/>
        <circle r="2.5" fill="#ffffff"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#9ec5e8" stroke-width="2"/>
        <path d="M -4 8 L 0 12 L 4 8" fill="none" stroke="#9ec5e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <g font-family="'JetBrains Mono',monospace" font-size="22" fill="#9ec5e8" letter-spacing="0.15em">
      <text x="94"  y="290" text-anchor="middle">↑↑</text>
      <text x="306" y="290" text-anchor="middle">↑↓</text>
    </g>
    <text x="200" y="350" text-anchor="middle" fill="#9ec5e8" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="0.4em">SPINFLIP</text>
    <text x="200" y="366" text-anchor="middle" fill="#9ec5e8" font-family="'JetBrains Mono',monospace" font-size="7"  letter-spacing="0.3em" opacity="0.7">H I · 1420 MHz</text>
  </g>

  <!-- Paper: warm cream background, charcoal secondary, terracotta accent -->
  <g class="paper">
    <rect width="400" height="400" fill="#f3efe6"/>
    <rect width="400" height="400" fill="url(#grid-pp)"/>
    <line x1="200" y1="40"  x2="200" y2="80"  stroke="#5b5b5b" stroke-width="0.5" opacity="0.5"/>
    <line x1="200" y1="320" x2="200" y2="360" stroke="#5b5b5b" stroke-width="0.5" opacity="0.5"/>
    <line x1="40"  y1="200" x2="80"  y2="200" stroke="#5b5b5b" stroke-width="0.5" opacity="0.5"/>
    <line x1="320" y1="200" x2="360" y2="200" stroke="#5b5b5b" stroke-width="0.5" opacity="0.5"/>
    <circle cx="200" cy="200" r="140" fill="none" stroke="#5b5b5b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.5"/>
    <g transform="translate(200,200) scale(2.4)">
      <g transform="translate(-44,0)">
        <circle r="22" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
        <circle r="2.5" fill="#1a1a1a"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#c43d1f" stroke-width="2"/>
        <path d="M -4 -8 L 0 -12 L 4 -8" fill="none" stroke="#c43d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g>
        <path d="M -16 0 q 4 -6 8 0 t 8 0 t 8 0 t 8 0" fill="none" stroke="#c43d1f" stroke-width="1.4"/>
        <text x="0" y="-18" text-anchor="middle" fill="#c43d1f" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="0.1em">21 cm</text>
      </g>
      <g transform="translate(44,0)">
        <circle r="22" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
        <circle r="2.5" fill="#1a1a1a"/>
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#5b5b5b" stroke-width="2"/>
        <path d="M -4 8 L 0 12 L 4 8" fill="none" stroke="#5b5b5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <g font-family="'JetBrains Mono',monospace" font-size="22" fill="#5b5b5b" letter-spacing="0.15em">
      <text x="94"  y="290" text-anchor="middle">↑↑</text>
      <text x="306" y="290" text-anchor="middle">↑↓</text>
    </g>
    <text x="200" y="350" text-anchor="middle" fill="#5b5b5b" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="0.4em">SPINFLIP</text>
    <text x="200" y="366" text-anchor="middle" fill="#5b5b5b" font-family="'JetBrains Mono',monospace" font-size="7"  letter-spacing="0.3em" opacity="0.7">H I · 1420 MHz</text>
  </g>
</svg>
